name: Release npm packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          TAG="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag commit is on main
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$TAG" origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require OIDC-capable npm
        run: npm install --global npm@latest && npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply release version
        run: bun scripts/set-release-version.ts "${{ steps.release.outputs.version }}"

      - name: Build packages
        run: bun run build:cli

      - name: Validate package contents
        run: |
          npm pack --dry-run --json --workspace packages/types
          npm pack --dry-run --json --workspace packages/template-generator
          npm pack --dry-run --json --workspace apps/cli

      - name: Publish types with provenance
        working-directory: packages/types
        run: npm publish --access public --provenance

      - name: Publish template generator with provenance
        working-directory: packages/template-generator
        run: npm publish --access public --provenance

      - name: Publish CLI with provenance
        working-directory: apps/cli
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

      - name: Verify registry packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for package in @chacelow-stack/types @chacelow-stack/template-generator @chacelow-stack/create; do
            for attempt in $(seq 1 30); do
              if test "$(npm view "$package@$VERSION" version 2>/dev/null)" = "$VERSION"; then
                break
              fi
              if test "$attempt" = 30; then
                echo "Timed out waiting for $package@$VERSION" >&2
                exit 1
              fi
              sleep 10
            done
          done
