name: Bootstrap npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "First package version (MAJOR.MINOR.PATCH)"
        required: true
        default: "0.1.0"
        type: string
      confirmation:
        description: "Type BOOTSTRAP to authorize the one-time first publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    name: First publish only
    if: inputs.confirmation == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-bootstrap
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply first release version
        run: bun scripts/set-release-version.ts "${{ inputs.version }}"

      - name: Build packages
        run: bun run build:cli

      - name: Validate package contents
        run: |
          npm pack --dry-run --json --workspace packages/types
          npm pack --dry-run --json --workspace packages/template-generator
          npm pack --dry-run --json --workspace apps/cli


      - name: Publish CLI
        working-directory: apps/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify registry packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for package in @chacelow-stack/types @chacelow-stack/template-generator @chacelow-stack/create; do
            for attempt in $(seq 1 30); do
              if test "$(npm view "$package@$VERSION" version 2>/dev/null)" = "$VERSION"; then
                break
              fi
              if test "$attempt" = 30; then
                echo "Timed out waiting for $package@$VERSION" >&2
                exit 1
              fi
              sleep 10
            done
          done
          echo "Bootstrap complete. Configure Trusted Publishers for release.yaml, then delete NPM_TOKEN."
